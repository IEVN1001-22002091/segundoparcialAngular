<div class="max-w-2xl mx-auto p-4 bg-white border border-gray-300 shadow-sm my-4 rounded-md">

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
    
    <div class="border-r-0 md:border-r border-gray-300 pr-0 md:pr-6">
      
      <div class="border border-gray-400 p-3 rounded">
        <h2 class="text-center text-sm font-semibold mb-3 text-gray-800">Datos Personales</h2>

        <form [formGroup]="formZodiaco" (ngSubmit)="imprimir()">
          
          <div class="flex items-center mb-2">
            <label class="w-20 text-xs font-medium text-gray-700">Nombre</label>
            <input
              type="text"
              formControlName="nombre"
              placeholder="Nombre"
              class="flex-1 border border-gray-400 rounded px-2 py-1 text-xs focus:outline-none"
            >
          </div>

          <div class="flex items-center mb-2">
            <label class="w-20 text-xs font-medium text-gray-700">APaterno</label>
            <input
              type="text"
              formControlName="apaterno"
              placeholder="APaterno"
              class="flex-1 border border-gray-400 rounded px-2 py-1 text-xs focus:outline-none"
            >
          </div>

          <!-- AMaterno -->
          <div class="flex items-center mb-2">
            <label class="w-20 text-xs font-medium text-gray-700">AMaterno</label>
            <input
              type="text"
              formControlName="amaterno"
              placeholder="AMaterno"
              class="flex-1 border border-gray-400 rounded px-2 py-1 text-xs focus:outline-none"
            >
          </div>

          <!-- Fecha de nacimiento -->
          <div class="mt-3 mb-2">
            <p class="text-center text-xs font-medium mb-1">Fecha de nacimiento</p>
            <div class="grid grid-cols-3 gap-2 text-center">
              <div>
                <span class="text-[10px] text-gray-600 block">Día</span>
                <input
                  type="number"
                  formControlName="dia"
                  class="w-full border border-gray-400 rounded px-1 py-1 text-xs text-center"
                >
              </div>
              <div>
                <span class="text-[10px] text-gray-600 block">Mes</span>
                <input
                  type="number"
                  formControlName="mes"
                  class="w-full border border-gray-400 rounded px-1 py-1 text-xs text-center"
                >
              </div>
              <div>
                <span class="text-[10px] text-gray-600 block">Año</span>
                <input
                  type="number"
                  formControlName="anio"
                  class="w-full border border-gray-400 rounded px-1 py-1 text-xs text-center"
                >
              </div>
            </div>
          </div>

          <!-- Sexo -->
          <div class="mt-3 mb-3">
            <p class="text-xs font-medium mb-1">sexo</p>
            <div class="flex flex-col gap-0.5 ml-2">
              <label class="inline-flex items-center text-xs">
                <input type="radio" formControlName="sexo" value="Masculino" class="mr-1.5 h-3 w-3">
                Masculino
              </label>
              <label class="inline-flex items-center text-xs">
                <input type="radio" formControlName="sexo" value="Femenino" class="mr-1.5 h-3 w-3">
                Femenino
              </label>
            </div>
          </div>

          <!-- Botón Imprimir -->
          <div class="mt-4">
            <button
              type="submit"
              class="w-full border-2 border-black font-bold py-1 text-sm text-black hover:bg-gray-100 transition-colors"
            >
              imprimir
            </button>
          </div>

        </form>
      </div>

    </div>

    <!-- COLUMNA DERECHA: Impresión de Resultados -->
    <div class="flex flex-col items-center justify-center min-h-[220px]">
      
      <div *ngIf="resultado" class="text-center space-y-2">
        
        <h2 class="text-base font-normal text-gray-900">
          Hola <span class="font-bold italic">{{ resultado.nombreCompleto }}</span>
        </h2>

        <p class="text-sm font-medium text-gray-800">
          Tienes <span class="font-bold">{{ resultado.edad }}</span> años
        </p>

        <p class="text-sm text-gray-700">
          tu signo zodiacal
        </p>

        <div class="flex items-center justify-center gap-3 mt-3">
  <span class="text-base font-semibold text-gray-800">
    Es {{ resultado.signo }}
  </span>
  
  <div class="w-20 h-20 rounded-full bg-blue-600 p-2 flex items-center justify-center overflow-hidden shadow-sm">
    <img
      [src]="resultado.imagen"
      [alt]="resultado.signo"
      class="w-full h-full object-cover rounded-full"
    >
  </div>
</div>

      </div>

    </div>

  </div>

</div>
